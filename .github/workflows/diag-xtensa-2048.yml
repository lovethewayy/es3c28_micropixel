name: Diagnose 2048 xtensa AOT crash
on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Allow git in container workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build gcc g++ git python3

      - name: Install WASI SDK 33
        run: |
          curl -fL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz -o /tmp/wasi.tar.gz
          mkdir -p /opt/wasi-sdk
          tar -xzf /tmp/wasi.tar.gz -C /opt/wasi-sdk --strip-components=1
          rm -f /tmp/wasi.tar.gz
          /opt/wasi-sdk/bin/clang --version | head -1

      - name: Restore Xtensa LLVM build cache
        id: xtensa-llvm-cache
        uses: actions/cache/restore@v4
        with:
          path: firmware/espressif/components/wasm-micro-runtime/core/deps/llvm/build
          key: es3c28p-wamrc-llvm-${{ hashFiles('firmware/espressif/components/wasm-micro-runtime/build-scripts/build_llvm.py') }}
          restore-keys: |
            es3c28p-wamrc-llvm-

      - name: Build Xtensa wamrc
        run: |
          . /opt/esp/idf/export.sh
          bash tools/build_wamrc_xtensa.sh
          build/tools/wamrc-xtensa/wamrc --version

      - name: Compile 2048 wasm only (skip AOT)
        run: |
          set -euo pipefail
          . /opt/esp/idf/export.sh
          export WASI_SDK_PATH=/opt/wasi-sdk
          # Build wasm only (AOT compilation will fail; wasm survives).
          WDIR=build/diag-xtensa
          rm -rf "$WDIR"
          python tools/micropixel build guest/apps/2048 \
            --aot-target xtensa \
            --output-dir "$WDIR" 2>&1 | tail -8 || true
          ls -la "$WDIR"/*.wasm 2>/dev/null || echo "wasm not found"

      - name: Flag sweep - find what crashes
        run: |
          set +e
          WAMRC=build/tools/wamrc-xtensa/wamrc
          WASM=build/diag-xtensa/game2048.wasm
          ls -la "$WASM" 2>/dev/null || { echo "NO WASM"; exit 0; }
          BASE=(--target=xtensa --cpu=esp32s3 --bounds-checks=1 --enable-memory-profiling --disable-ref-types --disable-simd)
          run_case() {
            local name="$1"; shift
            echo "########## CASE: $name"
            "$WAMRC" "${BASE[@]}" "$@" -o /tmp/test.aot "$WASM" 2>&1 | head -8
            echo "exit=${PIPESTATUS[0]}"
          }
          run_case "full (opt3 callstack size0 dump)" --opt-level=3 --call-stack-features=ip,func-idx --size-level=0 --enable-dump-call-stack
          run_case "no dump-call-stack" --opt-level=3 --call-stack-features=ip,func-idx --size-level=0
          run_case "no call-stack-features" --opt-level=3 --size-level=0
          run_case "no callstack no dump" --opt-level=3 --size-level=0
          run_case "opt-level=0" --opt-level=0 --size-level=0
          run_case "opt-level=1" --opt-level=1 --size-level=0
          run_case "opt-level=2" --opt-level=2 --size-level=0
          run_case "size-level=3 (like other apps)" --opt-level=3 --call-stack-features=ip,func-idx --size-level=3
          run_case "minimal" --opt-level=3
          echo "=========== DONE"

      - name: Variant experiments - locate source trigger
        run: |
          set +e
          . /opt/esp/idf/export.sh
          export WASI_SDK_PATH=/opt/wasi-sdk
          cp -r guest/apps/2048 /tmp/v2048
          # Variant A: noinline the small helpers (prevent aggressive O3 inlining)
          cp -r /tmp/v2048 /tmp/vA
          sed -i 's/uint32_t SlideLine(uint32_t\* line, uint32_t count)/__attribute__((noinline)) uint32_t SlideLine(uint32_t* line, uint32_t count)/' /tmp/vA/game2048_app.cpp
          sed -i 's/void Transpose(uint32_t (\*board)\[kGridSize\])/__attribute__((noinline)) void Transpose(uint32_t (*board)[kGridSize])/' /tmp/vA/game2048_app.cpp
          sed -i 's/void ReverseRows(uint32_t (\*board)\[kGridSize\])/__attribute__((noinline)) void ReverseRows(uint32_t (*board)[kGridSize])/' /tmp/vA/game2048_app.cpp
          # Variant B: TileColor switch -> lookup table
          cp -r /tmp/v2048 /tmp/vB
          python3 - <<'PY'
import re
p="/tmp/vB/game2048_app.cpp"
s=open(p).read()
table='''micropixel::Color TileColor(uint32_t value) {
    static const micropixel::Color palette[12] = {
        micropixel::Color::Rgb(237U, 194U, 46U),
        micropixel::Color::Rgb(238U, 228U, 218U),
        micropixel::Color::Rgb(237U, 224U, 200U),
        micropixel::Color::Rgb(242U, 177U, 121U),
        micropixel::Color::Rgb(245U, 149U, 99U),
        micropixel::Color::Rgb(246U, 124U, 95U),
        micropixel::Color::Rgb(246U, 94U, 59U),
        micropixel::Color::Rgb(237U, 207U, 114U),
        micropixel::Color::Rgb(237U, 204U, 97U),
        micropixel::Color::Rgb(237U, 200U, 80U),
        micropixel::Color::Rgb(237U, 197U, 63U),
        micropixel::Color::Rgb(237U, 194U, 46U),
    };
    uint32_t index = 0U;
    while (value > 1U && index < 11U) { value >>= 1U; index += 1U; }
    return palette[index];
}'''
start=s.index("micropixel::Color TileColor(uint32_t value) {")
end=s.index("micropixel::Color TileTextColor(uint32_t value) {")
s=s[:start]+table+"\n\n"+s[end:]
open(p,"w").write(s)
print("variant B written")
PY
          for v in A B; do
            echo "########## VARIANT $v (opt-level=3)"
            python tools/micropixel build /tmp/v$v --aot-target xtensa --output-dir /tmp/out-$v 2>&1 | tail -4
            echo "variant-$v exit=${PIPESTATUS[0]}"
          done
          echo "=========== VARIANTS DONE"
